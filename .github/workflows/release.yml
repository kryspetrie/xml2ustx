# Build and publish GUI release assets for semver tags (vX.Y.Z).
# OpenUtau sidecar zips are not built in CI — see docs/DISTRIBUTION.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build (e.g. v0.1.0)
        required: true
        type: string
      publish_assets:
        description: Upload built files to the GitHub Release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-gui:
    if: ${{ startsWith(github.event.inputs.tag_name || github.ref_name, 'v') }}
    env:
      GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            runs-on: windows-latest
            python-arch: x64
          - name: win-x86
            runs-on: windows-latest
            python-arch: x86
          - name: win-arm64
            runs-on: windows-11-arm
            python-arch: arm64
          - name: linux-x64
            runs-on: ubuntu-latest
            python-arch: x64
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            python-arch: arm64
          - name: osx-x64
            runs-on: macos-15-intel
            target-arch: x64
            python-arch: x64
          - name: osx-arm64
            runs-on: macos-15
            target-arch: arm64
            python-arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch || 'x64' }}

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/install_qt_system_deps.sh

      - name: Build GUI package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: ./scripts/ci/build_gui_package.ps1 -ArtifactName xml2ustx-gui-${{ matrix.name }}

      - name: Build GUI package (macOS)
        if: runner.os == 'macOS'
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          TARGET_ARCH: ${{ matrix.target-arch }}
        run: |
          chmod +x scripts/ci/*.sh
          ./scripts/ci/build_gui_package.sh xml2ustx-gui-${{ matrix.name }} "$GITHUB_WORKSPACE"

      - name: Build GUI package (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          chmod +x scripts/ci/*.sh
          ./scripts/ci/build_gui_package.sh xml2ustx-gui-${{ matrix.name }} "$GITHUB_WORKSPACE"

      - name: Build AppImage (Linux x64)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse libfuse2 librsvg2-bin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a gui-pkg/xml2ustx/. AppDir/usr/bin/
          cp packaging/xml2ustx.desktop AppDir/usr/share/applications/
          rsvg-convert -w 256 -h 256 packaging/xml2ustx.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/xml2ustx.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname "$0")" && pwd)"
          exec "$HERE/usr/bin/xml2ustx" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/xml2ustx
          ARCH=x86_64 ./linuxdeploy \
            --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/xml2ustx.desktop \
            --icon-file=AppDir/usr/share/icons/hicolor/256x256/apps/xml2ustx.png \
            --output appimage
          mv xml2ustx*.AppImage "xml2ustx-gui-${{ matrix.name }}.AppImage" || mv *.AppImage "xml2ustx-gui-${{ matrix.name }}.AppImage"

      - name: Build Flatpak (Linux x64)
        if: matrix.name == 'linux-x64'
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          ./scripts/ci/build_flatpak.sh xml2ustx-gui-${{ matrix.name }} "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: xml2ustx-gui-${{ matrix.name }}
          path: xml2ustx-gui-${{ matrix.name }}.zip
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux-x64'
        with:
          name: xml2ustx-gui-${{ matrix.name }}-appimage
          path: xml2ustx-gui-${{ matrix.name }}.AppImage
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux-x64'
        with:
          name: xml2ustx-gui-${{ matrix.name }}-flatpak
          path: xml2ustx-gui-${{ matrix.name }}.flatpak
          retention-days: 14
          if-no-files-found: error

  publish:
    if: >-
      ${{
        needs.build-gui.result == 'success' &&
        startsWith(github.event.inputs.tag_name || github.ref_name, 'v') &&
        (github.event_name == 'push' || github.event.inputs.publish_assets != 'false')
      }}
    needs: [build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        run: |
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.flatpak' \) -exec cp {} . \;
          ls -la

      - name: Generate SHA256 checksums
        run: |
          sha256sum xml2ustx-* > CHECKSUMS.sha256
          cat CHECKSUMS.sha256

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: xml2ustx ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xml2ustx-gui-*.zip
            xml2ustx-gui-*.AppImage
            xml2ustx-gui-*.flatpak
            CHECKSUMS.sha256
          fail_on_unmatched_files: true
