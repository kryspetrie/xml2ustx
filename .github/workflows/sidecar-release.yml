# Build xml2ustx sidecar binaries on native runners (one zip per platform).
name: Sidecar release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. sidecar-0.1.0)"
        required: true
        type: string

jobs:
  build-sidecar:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            runs-on: windows-latest
            python-arch: x64
          - name: win-x86
            runs-on: windows-latest
            python-arch: x86
          - name: win-arm64
            runs-on: windows-11-arm
            python-arch: arm64
          - name: linux-x64
            runs-on: ubuntu-latest
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
          - name: osx-x64
            runs-on: macos-15-intel
            target-arch: x64
          - name: osx-arm64
            runs-on: macos-15-intel
            target-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/build_and_package_sidecar.ps1 -ArtifactName xml2ustx-${{ matrix.name }}

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET_ARCH: ${{ matrix.target-arch }}
        run: ./scripts/ci/build_and_package_sidecar.sh xml2ustx-${{ matrix.name }} "$GITHUB_WORKSPACE"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/ci/build_and_package_sidecar.sh xml2ustx-${{ matrix.name }} "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: xml2ustx-${{ matrix.name }}
          path: xml2ustx-${{ matrix.name }}.zip

  publish:
    needs: build-sidecar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifact paths
        run: find artifacts -name 'xml2ustx-*.zip' -exec cp {} . \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: xml2ustx sidecar ${{ inputs.tag }}
          files: xml2ustx-*.zip
          draft: false
          prerelease: false
